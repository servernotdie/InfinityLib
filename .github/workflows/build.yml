name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    if: startsWith(github.event.head_commit.message, '[CI skip]') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: 'maven'

      - name: Configure git
        run: |
          git config user.name "mytai20100"
          git config user.email "142713298+Mytai20100@users.noreply.github.com"

      - name: Apply patches
        run: bash patches/patch.sh

      - name: Environment Setup
        id: env-setup
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          TAG="build-$(date +'%Y%m%d')-$SHORT_COMMIT_HASH"
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_ENV"
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: mvn package -Dmaven.deploy.skip=true --file pom.xml

      - name: Get build artifact filename
        run: |
          cd target
          rm -rf original*
          FILE=$(find . -maxdepth 1 -type f -name "*.jar" -printf "%f\n")
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: target/${{ env.FILE }}

      - name: Create Release
        run: |
          gh release create "$TAG" \
            --title "InfinityLib Build $TAG" \
            --notes "Auto build from commit ${{ github.sha }}" \
            --prerelease \
            "target/$FILE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
